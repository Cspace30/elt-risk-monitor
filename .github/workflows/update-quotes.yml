name: update-quotes

# 5분마다 지수 시세를 받아 quotes 브랜치의 quotes.json 으로 저장합니다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-quotes
  cancel-in-progress: true

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 이전 시세 불러오기 (일부 지수 조회 실패 시 직전 값 유지)
        run: curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/quotes/quotes.json?t=$(date +%s)" -o previous.json || echo '{}' > previous.json

      - name: 시세 조회
        run: |
          cat > fetch-quotes.mjs <<'JSEOF'
          // 지수 시세를 받아 quotes.json 으로 저장 (GitHub Actions 에서 실행)
          import fs from 'node:fs';
          const SYM = { KOSPI200: '^KS200', 'S&P500': '^GSPC', NIKKEI225: '^N225', EUROSTOXX50: '^STOXX50E', HSCEI: '^HSCE' };
          const BASES = [process.env.YAHOO_BASE || 'https://query1.finance.yahoo.com', process.env.YAHOO_BASE2 || 'https://query2.finance.yahoo.com'];
          const HEAD = { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36', 'Accept': 'application/json' };

          async function one(sym) {
            let err;
            for (const b of BASES) {
              try {
                const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 10000);
                const r = await fetch(b + '/v8/finance/chart/' + encodeURIComponent(sym) + '?interval=1m&range=1d', { headers: HEAD, signal: ctl.signal });
                clearTimeout(tm);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const m = (await r.json()).chart.result[0].meta;
                const per = (m.currentTradingPeriod && m.currentTradingPeriod.regular) || {};
                if (!isFinite(m.regularMarketPrice)) throw new Error('no price');
                return { price: m.regularMarketPrice, prev: m.chartPreviousClose ?? m.previousClose ?? null, t: (m.regularMarketTime || 0) * 1000, start: (per.start || 0) * 1000, end: (per.end || 0) * 1000 };
              } catch (e) { err = e; }
            }
            throw err;
          }

          let prev = {};
          try { prev = JSON.parse(fs.readFileSync('previous.json', 'utf8')).quotes || {}; } catch (e) { }
          const quotes = { ...prev };
          let ok = 0;
          await Promise.all(Object.entries(SYM).map(async ([k, s]) => {
            try { quotes[k] = await one(s); ok++; console.log('OK  ', k, quotes[k].price); }
            catch (e) { console.log('FAIL', k, String(e.message || e)); }
          }));
          if (!ok) { console.log('모든 지수 조회 실패 - 이번 회차는 건너뜁니다.'); process.exit(0); }
          fs.writeFileSync('quotes.json', JSON.stringify({ updatedAt: Date.now(), quotes }));
          console.log('saved quotes.json (' + ok + '/' + Object.keys(SYM).length + ')');
          JSEOF
          node fetch-quotes.mjs

      - name: quotes 브랜치에 게시
        run: |
          if [ ! -f quotes.json ]; then echo "새 시세 없음 - 건너뜀"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/pub && cp quotes.json /tmp/pub/quotes.json
          git checkout --orphan quotes-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/pub/quotes.json quotes.json
          git add quotes.json
          git commit -m "update quotes" -q
          git push -f origin quotes-tmp:quotes

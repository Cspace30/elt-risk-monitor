<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리스크 모니터</title>
<style>
:root{
  --navy:#1f2a44; --navy2:#2a3757; --orange:#e8590c; --orange2:#f7a23b;
  --bg:#f3f5f9; --card:#fff; --line:#e3e7ee; --line2:#eef1f6; --tx:#1c2333; --tx2:#5b6578; --tx3:#8a93a5;
  --blue:#0b4dff; --red:#d6243f; --green:#1a7f37;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;font-size:13px;color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
#wm{position:fixed;inset:0;z-index:9999;pointer-events:none;background-repeat:repeat}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;padding:0 14px;height:58px;position:relative}
.brand{font-size:19px;font-weight:800;color:var(--orange2);letter-spacing:-.3px;margin-right:4px}
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:4px;border-radius:9px}
.tab{padding:7px 14px;border-radius:7px;font-weight:700;font-size:13px;color:#e4e8f2}
.tab.on{background:#fff;color:var(--navy)}
.meta{font-size:11.5px;color:#c9d0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.cd{font-size:11.5px;color:#c9d0e0;white-space:nowrap}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:7px;padding:7px 12px;font-size:12.5px;font-weight:600}
.hbtn:hover{background:rgba(255,255,255,.1)}

/* ---------- ticker ---------- */
.ticker{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-bottom:1px solid var(--line)}
.tk{padding:11px 16px 9px;border-top:3px solid #999;border-right:1px solid var(--line2);min-width:0}
.tk:last-child{border-right:none}
.tk .n{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2)}
.tk .n i{display:inline-block;width:20px;height:0;border-top:3px solid;border-radius:2px;margin-right:2px}
.tk .n svg{width:20px;height:14px;border:1px solid #d8dde6;border-radius:2px;flex:none}
.tk .bd{font-size:10.5px;padding:1px 6px;border-radius:4px;background:#e7f4ec;color:#1a7f37;font-weight:600}
.tk .bd.g{background:#eef0f4;color:#6b7487}
.tk .p{display:flex;align-items:baseline;gap:7px;margin-top:5px}
.tk .p b{font-size:20px;font-weight:800;letter-spacing:-.4px}
.tk .p span{font-size:12px;font-weight:600}
.up{color:#e0245e}.dn{color:#1a6fe0}
.tk .t{font-size:11px;color:var(--tx3);margin-top:3px}

/* ---------- monitor ---------- */
.page{padding:16px 20px 40px}
.mon{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{border-radius:8px;text-align:center;padding:7px 0 5px}
.tile b{display:block;font-size:17px;font-weight:800;line-height:1.15}
.tile span{font-size:10.5px;font-weight:600}
.tile.ok{background:#e4f5e9;color:#1a7f37}.tile.near{background:#fff0d6;color:#d9770a}
.tile.miss{background:#fde9df;color:#d9480f}.tile.ki{background:#fde4e8;color:#d6243f}
.side input,.side select{width:100%;margin-top:10px;padding:10px 11px;border:1px solid #cfd5e0;border-radius:8px;font-size:13.5px;font-family:inherit;background:#fff;color:var(--tx)}
.side input::placeholder{color:#8a93a5}
.plist{margin:12px -4px 0;overflow:auto;flex:1;border-top:1px solid var(--line2);padding:6px 4px 0}
.pi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 11px;border-left:4px solid #d9480f;margin-bottom:4px;border-radius:5px;cursor:pointer}
.pi:hover{background:#f6f8fb}.pi.sel{background:#fff0e5;box-shadow:inset 0 0 0 1px #f8c9a8}
.pi.ok{border-left-color:#1f9d55}.pi.near{border-left-color:#c58a00}.pi.miss{border-left-color:#d9480f}.pi.done{border-left-color:#9aa3b2}
.pi .l1{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px}
.pi .l2{font-size:11px;color:var(--tx2);margin-top:3px}
.pi .r1{text-align:right;font-weight:800;font-size:13.5px}
.pi .r2{text-align:right;font-size:11.5px;color:var(--tx2);margin-top:3px}
.bg{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;white-space:nowrap}
.bg.miss{background:#ffeadb;color:#d9480f}.bg.near{background:#fff1cc;color:#b36b00}
.bg.ok{background:#dff3e6;color:#1a7f37}.bg.done{background:#eceef2;color:#6b7487}.bg.ki{background:#fde1e6;color:#d6243f}

.mhead{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.mhead h1{font-size:25px;margin:0;font-weight:800;letter-spacing:-.5px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #cdd4e0;border-radius:99px;padding:3px 12px 3px 8px;font-size:12px;background:#fff}
.pill i{width:16px;border-top:3px solid;border-radius:2px;display:inline-block}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px}
.kpi .k{font-size:12px;color:var(--tx2)}
.kpi .v{font-size:23px;font-weight:800;margin-top:7px;letter-spacing:-.4px}
.kpi .s{font-size:11.5px;color:var(--tx2);margin-top:5px}
.neg{color:#e03e0b}.pos{color:#1a7f37}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;margin-top:16px}
.card h2{margin:0 0 6px;font-size:16px;font-weight:800;display:flex;align-items:baseline;gap:9px}
.card h2 small{font-size:12px;font-weight:400;color:var(--tx2)}
.lg{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--tx2);margin:6px 0 2px;flex-wrap:wrap}
.lg span{display:inline-flex;align-items:center;gap:5px}
.lg i{display:inline-block;width:20px;border-top:3px solid}
.lg b{color:var(--tx)}
#chart svg{display:block;width:100%}
#chart text{font-family:inherit}

.pos-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px}
.pos-row .nm{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.pos-row .nm i{width:22px;border-top:4px solid;border-radius:2px}
.pos-row .nm em{font-style:normal;font-size:10.5px;font-weight:700;background:#fff0e0;color:#d9770a;border-radius:99px;padding:1px 8px;margin-left:2px}
.pos-row .val{font-size:13px;color:var(--tx2)}
.pos-row .val b{font-size:17px;color:var(--blue);font-weight:800;margin-right:3px}
.bar{position:relative;height:46px;margin-top:2px}
.bar .tr{position:absolute;left:0;right:0;top:20px;height:14px;display:flex}
.bar .z{height:100%}
.bar .mk{position:absolute;top:16px;height:26px;border-left:2px solid #222}
.bar .lb{position:absolute;top:0;font-size:11px;transform:translateX(-50%);white-space:nowrap;color:var(--tx2)}
.bar .dot{position:absolute;top:21px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 2px var(--blue)}
.bar .cl{position:absolute;top:44px;font-size:11.5px;font-weight:700;color:var(--blue);transform:translateX(-50%)}
.pinfo{font-size:12px;color:var(--tx2);margin-top:20px;display:flex;gap:24px;flex-wrap:wrap}
.pinfo b{color:var(--tx)}.pinfo .r{color:#d6243f;font-weight:700}
.sep{border-top:1px solid var(--line2);margin:14px 0 0}

table.tb{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.tb th{background:#f3f5f9;color:var(--tx2);font-weight:600;text-align:right;padding:9px 11px;font-size:12px;white-space:nowrap}
table.tb th:first-child,table.tb td:first-child{text-align:left}
table.tb td{padding:9px 11px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums}
table.tb td.c,table.tb th.c{text-align:left}
table.tb tr.hl td{background:#fff3e8;font-weight:700}
table.tb tr.past td{color:#8a93a5}
.res{display:inline-block;border-radius:5px;padding:3px 10px;font-size:12px;font-weight:600}
.res.no{background:#ffeadb;color:#c2410c}.res.yes{background:#dff3e6;color:#1a7f37}.res.gr{background:#eceef2;color:#6b7487}
.sbox{max-height:340px;overflow:auto;margin-top:8px;position:relative}
.sbox table.tb{margin-top:0}
.sbox th{position:sticky;top:0;z-index:2}
.sbox td.c{text-align:left}
.sbox td:nth-child(3),.sbox th:nth-child(3){text-align:right;padding-right:60px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
.t-eval{background:#fdeedd;color:#c2410c}.t-settle{background:#e2f4e8;color:#146c43}.t-pay{background:#e2ecfb;color:#1d5fb0}
.t-trade{background:#ece6fb;color:#5a32a3}.t-effect{background:#d9f3f3;color:#0f6e6e}.t-mature{background:#fde2e2;color:#b02a37}.t-etc{background:#eceef1;color:#495057}

/* ---------- schedule ---------- */
.sch{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;align-items:start}
.calcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.calbar{display:flex;align-items:center;gap:10px}
.calbar h2{margin:0 6px;font-size:18px;font-weight:800}
.sq{border:1px solid #cfd5e0;background:#fff;border-radius:7px;padding:6px 12px;font-weight:700;font-size:13px}
.sq.nav{padding:6px 11px}
.calbar select{margin-left:auto;border:1px solid #cfd5e0;border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid #d4dae5;border-radius:99px;padding:3px 11px 3px 8px;background:#fff;font-size:12px;color:var(--tx)}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip em{font-style:normal;color:var(--tx3)}
.chip.off{opacity:.45}
.cal{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cal .h,.cal .w{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .h div{background:#f3f5f9;text-align:center;font-weight:700;padding:7px 0;font-size:12px;border-bottom:1px solid var(--line)}
.cal .d{min-height:83px;padding:5px 5px 4px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);cursor:pointer;min-width:0}
.cal .d:nth-child(7n){border-right:none}
.cal .d.o{background:#f6f7fa;color:#aab1bf}
.cal .d.sel{box-shadow:inset 0 0 0 2px #f2a06a}
.cal .d .n{font-weight:700;font-size:12px;display:inline-block;min-width:18px;margin-bottom:3px}
.cal .d.sun .n{color:#d6243f}.cal .d.sat .n{color:#1a6fe0}
.cal .d.o .n{color:#b0b7c4}
.cal .d.today .n{background:var(--orange);color:#fff;border-radius:99px;padding:1px 6px;text-align:center}
.ev{font-size:11px;padding:2px 5px;border-left:3px solid;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.eval{background:#fdeedd;border-color:#e8590c;color:#c2410c}.ev.settle{background:#e2f4e8;border-color:#1f9d55;color:#146c43}
.ev.pay{background:#e2ecfb;border-color:#2f7bd8;color:#1d5fb0}.ev.trade{background:#ece6fb;border-color:#6f42c1;color:#5a32a3}
.ev.effect{background:#d9f3f3;border-color:#138f8f;color:#0f6e6e}.ev.mature{background:#fde2e2;border-color:#dc3545;color:#b02a37}
.ev.etc{background:#eceef1;border-color:#868e96;color:#495057}
.more{font-size:10.5px;color:var(--tx3);padding-left:4px}
.foot{font-size:11.5px;color:var(--tx2);margin-top:9px}
.upc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.upc h3{margin:0 0 8px;font-size:14.5px;display:flex;justify-content:space-between;align-items:baseline}
.upc h3 small{font-size:11.5px;font-weight:400;color:var(--tx2)}
.upc .g{margin-top:8px}
.upc .gh{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;padding:3px 0}
.upc .gh span{font-weight:500;color:var(--tx2);font-size:11.5px}
.upc .it{display:flex;align-items:center;gap:8px;padding:4px 0;font-weight:700;font-size:13.5px}
.upc .none{color:var(--tx3);padding:10px 0;font-size:12.5px}
.back{font-size:12px;color:var(--orange);background:none;border:none;padding:0;font-weight:700}

/* ---------- login / admin ---------- */
.lgn{min-height:100vh;background:var(--navy);display:flex;align-items:center;justify-content:center}
.lbox{width:340px;background:#fff;border-radius:14px;padding:28px 28px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.lbox h1{margin:0 0 12px;font-size:19px;font-weight:800}
.lbox p{margin:0 0 12px;color:var(--tx2);font-size:13px}
.lbox input{width:100%;border:2px solid #111;border-radius:9px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
.lbox .go{width:100%;margin-top:12px;background:var(--orange);color:#fff;border:none;border-radius:9px;padding:12px;font-weight:800;font-size:14.5px}
.lbox .err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:0}
.lbox .adm{display:block;margin:30px auto 0;background:#fff;border:1px solid #cfd5e0;border-radius:6px;padding:5px 11px;font-size:12.5px;color:var(--tx2)}
.lbox .bk{display:block;margin:18px auto 0;background:none;border:none;color:var(--tx2);font-size:12.5px}
.ahead{background:var(--navy);height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.ahead b{color:var(--orange2);font-size:16px;font-weight:800}
.ahead .hbtn{padding:5px 11px;font-size:12px}
.awrap{max-width:710px;margin:18px auto 40px;padding:0 12px}
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.acard h3{margin:0 0 6px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.acard .ds{font-size:12px;color:var(--tx2);min-height:34px}
.acard .cf{font-size:12px;margin:12px 0}
.acard .cf b{font-weight:800}
.drop{border:2px dashed #cfd5e0;border-radius:10px;text-align:center;padding:20px 10px;cursor:pointer;font-size:12px;color:var(--tx2);line-height:1.6}
.drop b{display:block;color:var(--tx);font-size:13px}
.drop.on{border-color:var(--orange);background:#fff7f0}
.btn{background:var(--orange);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-weight:700;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.line{background:#fff;color:var(--tx);border:1px solid #cfd5e0;font-weight:600}
.up-btn{margin-top:12px}
.msg{font-size:12px;margin-top:10px;padding:8px 10px;border-radius:7px;line-height:1.55}
.msg.ok{background:#e7f6ec;color:#146c43}.msg.err{background:#fdecec;color:#b02a37}
.msg details{margin-top:4px;color:#555}
.msg summary{cursor:pointer}
.msg ul{margin:4px 0 0;padding-left:18px;max-height:140px;overflow:auto}
.on-b{font-size:11px;font-weight:700;background:#dff3e6;color:#1a7f37;border-radius:6px;padding:2px 8px}
.on-b.off{background:#eceef2;color:#6b7487}
.pwrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pwrow input,.acard input.tx{flex:1;min-width:150px;padding:9px 10px;border:1px solid #cfd5e0;border-radius:7px;font-size:13px;font-family:inherit}
.acard .nt{font-size:11.5px;color:var(--tx2);margin-top:10px}
.acard details{margin-top:8px;font-size:12px;color:var(--tx2)}
.acard details summary{cursor:pointer}
.acard table{width:100%;font-size:11.5px;border-collapse:collapse;margin-top:6px}
.acard td{padding:3px 6px;border-bottom:1px solid var(--line2)}
.warnbar{background:#fff4e0;color:#9a5b00;border:1px solid #f4d9a8;border-radius:9px;padding:9px 12px;font-size:12px;margin-bottom:14px}
.empty{background:#fff;border:1px dashed #cfd5e0;border-radius:12px;padding:40px;text-align:center;color:var(--tx2);margin:30px auto;max-width:520px}
.empty b{display:block;font-size:16px;color:var(--tx);margin-bottom:8px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.mon{grid-template-columns:1fr}.side{position:static;max-height:none}.plist{max-height:360px}.sch{grid-template-columns:1fr}.ticker{grid-template-columns:repeat(2,1fr)}}

</style>
</head>

<div id="app"></div>
<div id="wm"></div>

      p.under.forEach(function (u) {

  }

  /* ---------- 스케줄표 ---------- */
  var TYPE_KEYS = [

      var kind = kindRaw == null || String(kindRaw).trim() === '' ? '기타' : String(kindRaw).trim();
      var key = typeKey(kind);
      var amt = col.amt >= 0 ? toNum(row[col.amt]) : NaN;
      items.push({ no: +mm[1], date: dt, ymd: ymd(dt), key: key, label: key === 'etc' ? '기타' : (key === 'pay' ? 'Pay 지급일' : kind), amount: isNaN(amt) ? null : amt });

  }

  /* ---------- 지수 일별 종가 (선택) : 날짜 | KOSPI200 | S&P500 | ... ---------- */
  function parseHistory(arrayBuffer) {
    var sh = readSheet(arrayBuffer), rows = sh.rows, warns = [];
    var hr = -1, r, c;
    for (r = 0; r < Math.min(rows.length, 10); r++) {

  /* ---------- 업로드 처리 ---------- */

  function doUpload(kind) {
    var f = pending[kind]; if (!f) return;
    var rd = new FileReader();
    rd.onerror = function () { setMsg('m-' + kind, '파일을 읽지 못했습니다.', 'err'); };

      try {
        var rec = { file: f.name, mtime: f.lastModified || Date.now(), uploadedAt: Date.now() }, ok;

          var r = P.parseRisk(rd.result);
          if (!r.products.length) throw new Error('‘n호’ 회차 블록을 찾지 못했습니다. 리스크 관리 엑셀이 맞는지 확인해 주세요.');
          rec.data = serRisk(r);
          return finishUp('risk', rec, '업로드 완료 · 회차 ' + r.products.length + '개, 지수 ' + Object.keys(r.spot).length + '개' + warnHtml(r.warns), { file: rec.file, mtime: rec.mtime, uploadedAt: rec.uploadedAt, json: JSON.stringify(rec.data) });
        } else if (kind === 'sched') {
          var s = P.parseSchedule(rd.result);
          if (!s.items.length) throw new Error('일정 행을 찾지 못했습니다. (종목명 · 일정 · 날짜 · 금액 열 필요)');
          rec.data = serSched(s.items);
          return finishUp('sched', rec, '업로드 완료 · 일정 ' + s.items.length + '건' + warnHtml(s.warns), { file: rec.file, mtime: rec.mtime, uploadedAt: rec.uploadedAt, json: JSON.stringify(rec.data) });
        } else {
          var h = P.parseHistory(rd.result), n = Object.keys(h.series).filter(function (k) { return h.series[k].length; });
          if (!n.length) throw new Error('지수 열을 찾지 못했습니다. (첫 행: 날짜, KOSPI200, S&P500 …)');
          var cut = new Date(2024, 10, 1).getTime(), ser = {};
          n.forEach(function (k) { ser[k] = h.series[k].filter(function (q) { return q[0] >= cut; }); });
          rec.series = ser;
          return finishUp('hist', rec, '업로드 완료 · ' + n.join(', ') + warnHtml(h.warns), { file: rec.file, mtime: rec.mtime, uploadedAt: rec.uploadedAt, keys: n }, n.map(function (k, i) { return { key: k, json: JSON.stringify(ser[k]) }; }));
        }

  function finishUp(kind, rec, okMsg, doc, extra) {

      var dz = $('[data-up="' + kind + '"]'); if (dz) { dz.classList.remove('on'); dz.innerHTML = '<b>여기를 눌러 파일 선택</b>또는 .xlsx 파일을 끌어다 놓기'; }

    var chain = Promise.resolve();

  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { S.q = e.target.value; $('#plist').innerHTML = listHtml(visList(S.prods.map(calc))); }
  });
  ['dragover', 'drop'].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      var dz = e.target.closest && e.target.closest('.drop'); if (!dz) return;
      e.preventDefault();
      if (ev === 'drop' && e.dataTransfer.files[0]) pickFile(dz.getAttribute('data-up'), e.dataTransfer.files[0]);
    });
  });
  window.addEventListener('hashchange', function () { route(); });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(drawChart, 150); });

  /* 자동 갱신 (10초) */
  setInterval(function () {
    if (S.view !== 'monitor' && S.view !== 'schedule') return;
    S.cd--;
    if (S.cd <= 0) { S.cd = REFRESH; var a = document.activeElement; if (a && a.id === 'q') { var c = $('#cd'); if (c) c.textContent = S.cd + '초 후 갱신'; return; } load(); route(true); return; }
    var c2 = $('#cd'); if (c2) c2.textContent = S.cd + '초 후 갱신';
  }, 1000);

  /* 시작 */
  S.ready = false;
  load();
  dbInit();
  if (SS) { var ok = sget('elt.ok', SS); S.viewOk = ok === S.cfg.viewHash; S.adminOk = !!sget('elt.adm', SS); }
  route();
})();

</script>
</body>
</html>
